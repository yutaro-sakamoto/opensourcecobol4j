name: build opensource COBOL 4J on Windows

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: 'Upload artifacts'
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps: 
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3.0.0

      - name: Checkout opensource COBOL 4J
        uses: actions/checkout@v7

      - name: Restore NuGet packages
        run: nuget restore ./win/
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      
      - name: Install opensource COBOL 4J
        working-directory: libcobj
        run: ./gradlew shadowJar

      # Generate the SBOM from the same checkout and Gradle configuration that
      # produce libcobj.jar, so the two always describe each other.
      # Deliberately not guarded by
      # upload-artifacts: running it on every push and pull request is what
      # keeps a broken SBOM configuration from surfacing only at release time.
      - name: Generate the SBOM of libcobj.jar
        working-directory: libcobj
        run: ./gradlew cyclonedxDirectBom

      - name: Build cobj.exe
        run: msbuild /p:Configuration=Release /p:AdditionalIncludePaths=./:./cobj/:./win:./lib win/opensourcecobol4j.sln

      # Deliberately not guarded by upload-artifacts: assembling the bundle on
      # every push and pull request is what keeps a broken bundle configuration
      # from surfacing only at release time.
      - name: Assemble the Windows release bundle
        run: |
          $version = (Select-String -Path configure.ac -Pattern 'AC_INIT\(\[opensource COBOL 4J\],\[([^\]]+)\]').Matches[0].Groups[1].Value
          if (-not $version) { Write-Error "failed to extract the version from configure.ac" }
          $name = "opensourcecobol4j-$version-windows-x64"
          New-Item -ItemType Directory -Path "$name/bin", "$name/lib", "$name/config", "$name/copy" | Out-Null
          Copy-Item win/x64/Release/cobj.exe "$name/bin/"
          Copy-Item libcobj/app/build/libs/libcobj.jar "$name/lib/"
          Copy-Item config/*.conf "$name/config/"
          Copy-Item copy/*.cpy "$name/copy/"
          Copy-Item win/install.ps1 "$name/"
          Copy-Item win/release-README.txt "$name/README.txt"
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Upload the Windows release bundle
        if: ${{inputs.upload-artifacts}}
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-zip
          path: opensourcecobol4j-*-windows-x64.zip
          if-no-files-found: error

      - name: Upload libcobj.jar
        if: ${{inputs.upload-artifacts}}
        uses: actions/upload-artifact@v7
        with:
          name: libcobj.jar
          path: libcobj/app/build/libs/libcobj.jar 
      
      - name: Upload cobj.exe
        if: ${{inputs.upload-artifacts}}
        uses: actions/upload-artifact@v7
        with:
          name: cobj.exe
          path: win/x64/Release/cobj.exe

      - name: Upload libcobj-sbom.json
        if: ${{inputs.upload-artifacts}}
        uses: actions/upload-artifact@v7
        with:
          name: libcobj-sbom.json
          path: libcobj/app/build/reports/libcobj-sbom.json

      - name: Upload libcobj-sbom.xml
        if: ${{inputs.upload-artifacts}}
        uses: actions/upload-artifact@v7
        with:
          name: libcobj-sbom.xml
          path: libcobj/app/build/reports/libcobj-sbom.xml

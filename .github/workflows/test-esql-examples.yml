name: ESQL example tests

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

permissions:
  contents: read

env:
  CLASSPATH: ":/usr/lib/opensourcecobol4j/libcobj.jar"

jobs:
  test-esql-examples:
    runs-on: codebuild-opensourcecobol4j-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: ${{ inputs.os }}

    services:
      postgres15:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: main_user
          POSTGRES_DB: testdb
          POSTGRES_HOST_AUTH_METHOD: "trust"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # The CodeBuild runner host runs kernel 4.14, but tar in Ubuntu 26.04 uses
      # openat2(2) and fchmodat2(2), which that kernel does not provide, so every
      # extraction fails with ENOSYS. Replace it with the Ubuntu 24.04 build,
      # which actions/setup-java and `tar zxf` then can use.
      - name: Install a tar that runs on the runner kernel
        if: inputs.os == 'ubuntu:26.04'
        run: |
          echo 'deb http://archive.ubuntu.com/ubuntu noble main' > /etc/apt/sources.list.d/noble.list
          printf 'Package: *\nPin: release n=noble\nPin-Priority: 100\n' > /etc/apt/preferences.d/noble
          apt-get update -y
          apt-get install -y --allow-downgrades "tar=$(apt-cache madison tar | awk '/noble/ {print $3; exit}')"
          apt-mark hold tar

      - name: Get the artifact name
        run: echo "ARTIFACT_NAME=${{ inputs.os }}" | sed 's/:/-/g' >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: opensourcecobol4j-${{ env.ARTIFACT_NAME }}-opt_

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install dependencies on Ubuntu 26.04
        if: inputs.os == 'ubuntu:26.04'
        run: |
          apt-get update -y
          apt-get install -y build-essential

      - name: Install dependencies on AlmaLinux 9
        if: inputs.os == 'almalinux:9'
        run: |
          dnf -y update
          dnf install -y gcc make diffutils

      - name: Install opensource COBOL 4J
        run: |
          tar zxf opensourcecobol4j.tar.gz
          mv opensourcecobol4j/* .
          make install

      - name: Configure database settings
        working-directory: example/esql/
        run: |
          printf '%s\n' \
            'DB_NAME=testdb' \
            'DB_HOST=postgres15' \
            'DB_PORT=5432' \
            'DB_USER=main_user' \
            'DB_PASSWORD=password' \
            > db-config.sh

      - name: Run ESQL examples
        working-directory: example/esql/
        run: make all

name: debug windows image

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  vctools:
    runs-on: codebuild-opensourcecobol4j-windows-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Install the MSVC build tools
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          choco install -y --no-progress visualstudio2022buildtools
          choco install -y --no-progress visualstudio2022-workload-vctools `
            --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows11SDK.22621"
          Write-Host "elapsed: $($sw.Elapsed)"

      - name: Show what got installed
        continue-on-error: true
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -products * -all -property installationPath
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -ErrorAction SilentlyContinue | Select-Object Name

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3.0.0

      - name: MSBuild version
        shell: pwsh
        run: msbuild -version

      - name: Checkout opensource COBOL 4J
        uses: actions/checkout@v7

      - name: Restore NuGet packages
        run: nuget restore ./win/

      - name: Build cobj.exe
        run: msbuild /p:Configuration=Release /p:AdditionalIncludePaths=./:./cobj/:./win:./lib win/opensourcecobol4j.sln

      - name: Show the built binary
        shell: pwsh
        run: Get-ChildItem win/x64/Release/cobj.exe

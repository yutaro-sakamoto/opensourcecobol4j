name: Check workflow files

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: codebuild-opensourcecobol4j-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
    steps: 
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          GOBIN=$(pwd) go install github.com/rhysd/actionlint/cmd/actionlint@latest
      
      - name: Run actionlint
        run: |
          ./actionlint
name: build Hagane COBOL

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      configure-args:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.os }}
    steps: 
      - uses: actions/setup-java@v5
        if: inputs.os == 'ubuntu:26.04'
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-java@v5
        if: inputs.os == 'almalinux:9'
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install dependencies on Ubuntu 26.04
        if: inputs.os == 'ubuntu:26.04'
        run: |
          apt-get update -y
          apt-get install -y build-essential gettext autoconf bison flex

      - name: Install dependencies on AlmaLinux 9
        if: inputs.os == 'almalinux:9'
        run: |
          dnf -y update
          dnf install -y gcc make autoconf diffutils gettext bison flex

      - name: Checkout Hagane COBOL
        uses: actions/checkout@v7
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      
      - name: Install Hagane COBOL
        if: inputs.configure-args == ''
        run: |
          ./configure --prefix=/usr/ CFLAGS=-Werror
          make
          echo "ARTIFACT_NAME=${{ inputs.os }}" | sed 's/:/-/g' >> "$GITHUB_ENV"

      - name: Install Hagane COBOL
        if: inputs.configure-args != ''
        run: |
          ./configure --prefix=/usr/ CFLAGS=-Werror ${{ inputs.configure-args }}
          touch cobj/*.m4
          make
          echo "ARTIFACT_NAME=${{ inputs.os }}" | sed 's/:/-/g' >> "$GITHUB_ENV"

      - name: Create an artifact file
        run: |
         # The checkout directory is named after the repository, so archive
         # it under a fixed top-level name that the test jobs can rely on.
         repo_dir="$(basename "$GITHUB_WORKSPACE")"
         cd ../
         tar zcf hagane-cobol.tar.gz --transform "s,^$repo_dir,hagane-cobol," "$repo_dir"
         mv hagane-cobol.tar.gz "$repo_dir"
      
      - name: Upload an artifact
        uses: actions/upload-artifact@v7
        with:
          name: hagane-cobol-${{ env.ARTIFACT_NAME }}-opt_${{ inputs.configure-args }}
          path: hagane-cobol.tar.gz
name: build opensource COBOL 4J

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      configure-args:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: codebuild-opensourcecobol4j-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: ${{ inputs.os }}
    steps: 
      # The CodeBuild runner host runs kernel 4.14, but tar in Ubuntu 26.04 uses
      # openat2(2) and fchmodat2(2), which that kernel does not provide, so every
      # extraction fails with ENOSYS. Replace it with the Ubuntu 24.04 build,
      # which actions/setup-java and `tar zxf` then can use.
      - name: Install a tar that runs on the runner kernel
        if: inputs.os == 'ubuntu:26.04'
        run: |
          echo 'deb http://archive.ubuntu.com/ubuntu noble main' > /etc/apt/sources.list.d/noble.list
          printf 'Package: *\nPin: release n=noble\nPin-Priority: 100\n' > /etc/apt/preferences.d/noble
          apt-get update -y
          apt-get install -y --allow-downgrades "tar=$(apt-cache madison tar | awk '/noble/ {print $3; exit}')"
          apt-mark hold tar

      - uses: actions/setup-java@v5
        if: inputs.os == 'ubuntu:24.04'
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-java@v5
        if: inputs.os == 'almalinux:9'
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install dependencies on Ubuntu 24.04
        if: inputs.os == 'ubuntu:24.04'
        run: |
          apt-get update -y
          apt-get install -y build-essential gettext autoconf bison flex

      - name: Install dependencies on AlmaLinux 9
        if: inputs.os == 'almalinux:9'
        run: |
          dnf -y update
          dnf install -y gcc make autoconf diffutils gettext bison flex

      - name: Install dependencies on Amazon Linux 2023
        if: inputs.os == 'amazonlinux:2023'
        run: |
          dnf -y update
          dnf install -y java-21-amazon-corretto-devel gcc make autoconf diffutils gettext tar gzip bison flex

      - name: Checkout opensource COBOL 4J
        uses: actions/checkout@v7
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      
      - name: Install opensource COBOL 4J
        if: inputs.configure-args == ''
        run: |
          ./configure --prefix=/usr/ CFLAGS=-Werror
          make
          echo "ARTIFACT_NAME=${{ inputs.os }}" | sed 's/:/-/g' >> "$GITHUB_ENV"

      - name: Install opensource COBOL 4J
        if: inputs.configure-args != ''
        run: |
          ./configure --prefix=/usr/ CFLAGS=-Werror ${{ inputs.configure-args }}
          touch cobj/*.m4
          make
          echo "ARTIFACT_NAME=${{ inputs.os }}" | sed 's/:/-/g' >> "$GITHUB_ENV"

      - name: Create an artifact file
        run: |
         cd ../
         tar zcf opensourcecobol4j.tar.gz opensourcecobol4j
         mv opensourcecobol4j.tar.gz opensourcecobol4j
      
      - name: Upload an artifact
        uses: actions/upload-artifact@v7
        with:
          name: opensourcecobol4j-${{ env.ARTIFACT_NAME }}-opt_${{ inputs.configure-args }}
          path: opensourcecobol4j.tar.gz
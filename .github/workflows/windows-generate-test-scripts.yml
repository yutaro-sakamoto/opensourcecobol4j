name: Generate test scripts for Windows

on:
  workflow_call:

permissions:
  contents: read

jobs:
  generate:
    runs-on: codebuild-opensourcecobol4j-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: ubuntu:26.04
    steps:
      # The CodeBuild runner host runs kernel 4.14, but tar in Ubuntu 26.04 uses
      # openat2(2) and fchmodat2(2), which that kernel does not provide, so every
      # extraction fails with ENOSYS. Replace it with the Ubuntu 24.04 build,
      # which actions/checkout then can use.
      - name: Install a tar that runs on the runner kernel
        run: |
          echo 'deb http://archive.ubuntu.com/ubuntu noble main' > /etc/apt/sources.list.d/noble.list
          printf 'Package: *\nPin: release n=noble\nPin-Priority: 100\n' > /etc/apt/preferences.d/noble
          apt-get update -y
          apt-get install -y --allow-downgrades "tar=$(apt-cache madison tar | awk '/noble/ {print $3; exit}')"
          apt-mark hold tar

      - name: Install dependencies
        run: |
          apt-get update -y
          apt-get install -y build-essential gettext autoconf bison flex

      - name: Checkout opensource COBOL 4J
        uses: actions/checkout@v7

      - name: Generate test scripts
        run: |
          ./configure
          cd tests
          make

      - name: Upload test scripts
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-scripts
          path: |
            tests/syntax
            tests/run
            tests/run-O
            tests/data-rep
            tests/data-rep-O
            tests/jp-compat
            tests/command-line-options
            tests/cobj-idx
            tests/file-lock
            tests/file-lock2
            tests/file-lock3
            tests/file-lock4
            tests/file-lock5
            tests/misc
            tests/esql-basic
            tests/esql-sqlca
            tests/esql-cobol-data
            tests/esql-misc
            tests/esql-sql-data
            tests/esql-utf8
            tests/atconfig
            tests/package.m4

name: debug container workspace

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  downgraded-tar-on-2604:
    runs-on: codebuild-opensourcecobol4j-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: ubuntu:26.04
    steps:
      - name: Install a kernel-4.14-compatible tar from noble
        run: |
          echo 'deb http://archive.ubuntu.com/ubuntu noble main' > /etc/apt/sources.list.d/noble.list
          apt-get update -y
          apt-cache madison tar
          VER=$(apt-cache madison tar | grep noble | head -1 | awk '{print $3}')
          echo "installing tar=$VER"
          apt-get install -y --allow-downgrades "tar=$VER"
          tar --version | head -1

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Checkout opensource COBOL 4J
        uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Show results
        run: |
          uname -a
          java -version
          ls -l | head

  image-2404:
    runs-on: codebuild-opensourcecobol4j-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Checkout opensource COBOL 4J
        uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Show results
        run: |
          uname -a
          java -version
          ls -l | head

  almalinux9:
    runs-on: codebuild-opensourcecobol4j-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: almalinux:9
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Checkout opensource COBOL 4J
        uses: actions/checkout@v7

      - name: Show results
        run: |
          uname -a
          tar --version | head -1
          ls -l | head

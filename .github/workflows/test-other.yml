name: Other tests

on:
  workflow_call:
    inputs:
      test-name:
        required: true
        type: string
      os:
        required: true
        type: string
      configure-args:
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CLASSPATH: ":/usr/lib/opensourcecobol4j/libcobj.jar"

jobs:
  test-other:
    runs-on: codebuild-opensourcecobol4j-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: ${{ inputs.os }}
    steps:
      # The CodeBuild runner host runs kernel 4.14, but tar in Ubuntu 26.04 uses
      # openat2(2) and fchmodat2(2), which that kernel does not provide, so every
      # extraction fails with ENOSYS. Replace it with the Ubuntu 24.04 build,
      # which actions/setup-java and `tar zxf` then can use.
      - name: Install a tar that runs on the runner kernel
        if: inputs.os == 'ubuntu:26.04'
        run: |
          echo 'deb http://archive.ubuntu.com/ubuntu noble main' > /etc/apt/sources.list.d/noble.list
          printf 'Package: *\nPin: release n=noble\nPin-Priority: 100\n' > /etc/apt/preferences.d/noble
          apt-get update -y
          apt-get install -y --allow-downgrades "tar=$(apt-cache madison tar | awk '/noble/ {print $3; exit}')"
          apt-mark hold tar

      - name: Get the artifact name
        run: echo "ARTIFACT_NAME=${{ inputs.os }}" | sed 's/:/-/g' >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: opensourcecobol4j-${{ env.ARTIFACT_NAME }}-opt_${{ inputs.configure-args }}

      - uses: actions/setup-java@v5
        if: inputs.os != 'amazonlinux:2023'
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install dependencies on Ubuntu 24.04
        if: inputs.os == 'ubuntu:24.04'
        run: |
          apt-get update -y
          apt-get install -y build-essential unzip nkf

      - name: Install dependencies on AlmaLinux 9
        if: inputs.os == 'almalinux:9'
        run: |
          dnf -y update
          dnf install -y gcc make diffutils glibc-gconv-extra unzip wget
          wget "https://github.com/nurse/nkf/archive/refs/tags/v2_1_3.tar.gz" -O nkf-2.1.3.tar.gz
          tar zxf nkf-2.1.3.tar.gz
          cd nkf-2_1_3
          make
          make install

      - name: Install dependencies on Amazon Linux 2023
        if: inputs.os == 'amazonlinux:2023'
        run: |
          dnf -y update
          dnf install -y gcc make diffutils tar gzip unzip wget nkf

      - name: Install Java
        if: inputs.os == 'amazonlinux:2023'
        run: |
          dnf install -y java-11-amazon-corretto-devel

      - name: Install opensource COBOL 4J
        run: |
          tar zxf opensourcecobol4j.tar.gz
          mv opensourcecobol4j/* .
          make install
      
      - name: Run tests ${{ inputs.test-name }}
        working-directory: tests/
        run:
          ./${{ inputs.test-name }}
      
      - name: Upload log files if tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.test-name }}-${{ env.ARTIFACT_NAME }}-log
          path: tests/${{ inputs.test-name }}.dir/

# Default SLF4J Simple Logger configuration bundled in libcobj.jar.
#
# libcobj ships slf4j-simple as its runtime logging provider. Without this
# file slf4j-simple defaults to logging at INFO level to stderr, so the ESQL
# runtime (jp.osscons.opensourcecobol.libcobj.sql.*) would print ERROR lines
# to stderr even when a COBOL program is executed with a plain `java` command
# and no extra options.
#
# Turn all logging off by default. A `-D` system property always takes
# precedence over this file, so logging can still be re-enabled per logger,
# e.g. (as the test suite does):
#   java -Dorg.slf4j.simpleLogger.log.jp.osscons.opensourcecobol.libcobj.sql.CobolSql=debug ...
org.slf4j.simpleLogger.defaultLogLevel=off
